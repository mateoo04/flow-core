name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Restore
        run: dotnet restore FlowCore.sln

      - name: Build
        run: dotnet build FlowCore.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FlowCore.sln --configuration Release --no-build
